[project]
name = "dcmtether"
version = "0.1.0"
description = "Lossless DICOM <-> NIfTI round trips for MRI series, with properly referenced DICOM derivatives. Research use only."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "highdicom>=0.28.2",
    "nibabel>=5.4.2",
    "numpy>=2.5.3",
    "pydicom>=3.0.2",
]

[project.scripts]
dcmtether = "dcmtether.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dicom-validator>=0.9.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "-ra"]
markers = [
    "network: needs network on first run (test files / DICOM standard, cached afterwards)",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
